<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verificador de Vazamento de Email</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px;
    }
    h1 {
      color: #333;
    }
    form {
      margin-top: 20px;
    }
    input, button {
      padding: 10px;
      margin: 5px;
    }
    .result {
      margin-top: 20px;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      max-width: 600px;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>Verifique se seu e-mail foi vazado</h1>
  <form id="form">
    <input type="email" id="email" placeholder="Digite seu email" required />
    <button type="submit">Verificar</button>
  </form>
  <div class="result" id="result"></div>

  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      result.innerHTML = "Verificando...";

      try {
        const res = await fetch("/.netlify/functions/check-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        if (!res.ok) throw new Error("Erro na API");
        const data = await res.json();

        if (data.length === 0) {
          result.innerHTML = "<strong>Nenhum vazamento encontrado para esse email.</strong>";
        } else {
          let output = "<h2>Vazamentos encontrados:</h2><ul>";
          data.forEach(item => {
            output += `<li><strong>${item.Name}</strong> (${item.BreachDate})<br>${item.Description}</li><br>`;
          });
          output += "</ul>";
          result.innerHTML = output;
        }
      } catch (err) {
        result.innerHTML = "Erro ao verificar email.";
      }
    });
  </script>
</body>
</html>
